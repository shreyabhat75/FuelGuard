services:
  - type: web
    name: fleetfuel-guard-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: cd server && npm ci --include=dev && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: fleetfuel-guard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_TTL_HOURS
        value: 12
      - key: CORS_ORIGIN
        value: https://fleetfuel-guard-web.onrender.com
      - key: CORS_ORIGIN_FALLBACK
        fromService:
          type: web
          name: fleetfuel-guard-web
          property: host

  - type: web
    name: fleetfuel-guard-web
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: VITE_API_MODE
        value: rest
      - key: VITE_API_URL
        value: https://fleetfuel-guard-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin

databases:
  - name: fleetfuel-guard-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: fuelguard
    user: fuelguard
    ipAllowList: []
